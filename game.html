<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lái Xe Né Tránh</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: #ffe6f0;
            color: #d63384;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #fff0f5 0%, #ffcbe4 100%);
            border: 4px solid #ff99bb;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(255, 153, 187, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }

        /* Header */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .tag-box {
            background: #ffffff;
            border: 2px solid #ff99bb;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #d63384;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Màn hình Menu */
        #menu-screen {
            width: 100%;
            flex: 1;
            background: rgba(255, 255, 255, 0.85);
            border: 3px dashed #ff99bb;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 26px;
            color: #ff3385;
            text-shadow: 2px 2px 0px #ffe6f0;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: white;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-easy { background: linear-gradient(135deg, #a8e6cf, #3b7a57); }
        .btn-medium { background: linear-gradient(135deg, #ffd3b6, #ff8b94); color: #800; }
        .btn-hard { background: linear-gradient(135deg, #ffaaa5, #ff8b94); }

        /* Màn hình Game Play */
        #game-play-screen {
            display: none;
            width: 100%;
            flex: 1;
            flex-direction: column;
            position: relative;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 15px;
            border-radius: 12px;
            border: 2px solid #ff99bb;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* Lòng đường đua */
        .road-container {
            width: 100%;
            flex: 1;
            background: #d9d9d9;
            border: 4px solid #b3b3b3;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        /* Vạch kẻ đường hiệu ứng chạy */
        .road-line {
            position: absolute;
            width: 6px;
            height: 40px;
            background: #ffffff;
            left: 33%;
            top: -50px;
            animation: moveRoad 0.8s linear infinite;
        }
        .road-line.right {
            left: 66%;
        }

        @keyframes moveRoad {
            0% { top: -50px; }
            100% { top: 100%; }
        }

        /* Xe của người chơi & Chướng ngại vật */
        .car {
            position: absolute;
            width: 55px;
            height: 90px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: left 0.15s ease-out;
            z-index: 5;
        }

        #player-car {
