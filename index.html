<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty - Lái Xe Né Tránh</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: #ffe6f0;
            color: #d63384;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #fff0f5 0%, #ffcbe4 100%);
            border: 4px solid #ff99bb;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(255, 153, 187, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }

        /* Header */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .tag-box {
            background: #ffffff;
            border: 2px solid #ff99bb;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #d63384;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Màn hình Menu */
        #menu-screen {
            width: 100%;
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: 3px dashed #ff99bb;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 26px;
            color: #ff3385;
            text-shadow: 2px 2px 0px #ffe6f0;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: white;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-easy { background: linear-gradient(135deg, #a8e6cf, #3b7a57); }
        .btn-medium { background: linear-gradient(135deg, #ffd3b6, #ff8b94); color: #800; }
        .btn-hard { background: linear-gradient(135deg, #ffaaa5, #ff4757); }

        /* Màn hình Game Play */
        #game-play-screen {
            display: none;
            width: 100%;
            flex: 1;
            flex-direction: column;
            position: relative;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 15px;
            border-radius: 12px;
            border: 2px solid #ff99bb;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* Lòng đường đua */
        .road-container {
            width: 100%;
            flex: 1;
            background: #d9d9d9;
            border: 4px solid #b3b3b3;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        /* Vạch kẻ đường hiệu ứng chạy */
        .road-line {
            position: absolute;
            width: 6px;
            height: 40px;
            background: #ffffff;
            left: 33%;
            top: -50px;
            animation: moveRoad 0.8s linear infinite;
        }
        .road-line.right {
            left: 66%;
        }

        @keyframes moveRoad {
            0% { top: -50px; }
            100% { top: 100%; }
        }

        /* Xe của người chơi & Chướng ngại vật */
        .car {
            position: absolute;
            width: 55px;
            height: 90px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: left 0.15s ease-out;
            z-index: 5;
        }

        #player-car {
            background: #ff66b2;
            border: 3px solid #ff1a8c;
            bottom: 20px;
        }

        .obstacle {
            background: #ffb3d1;
            border: 3px solid #ff4d94;
            top: -100px;
            z-index: 4;
        }

        /* Nút điều khiển phía dưới */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            height: 70px;
        }

        .ctrl-btn {
            flex: 1;
            background: white;
            border: 3px solid #ff99bb;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            color: #ff3385;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 153, 187, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.1s;
        }

        .ctrl-btn:active {
            background: #ffccd5;
            transform: scale(0.95);
        }

        /* Màn hình Game Over */
        #gameover-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 230, 240, 0.95);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header -->
        <div class="game-header">
            <div class="tag-box">🎀 Hello Kitty</div>
            <div class="tag-box">✨ Cute Edition</div>
        </div>

        <!-- Menu Chọn Độ Khó -->
        <div id="menu-screen">
            <h1>LÁI XE NÉ TRÁNH</h1>
            <p class="subtitle">Chọn độ khó để bắt đầu cuộc đua hồng!</p>
            <div class="btn-group">
                <button class="btn btn-easy" onclick="startGame(1)">🌱 DỄ (Chậm)</button>
                <button class="btn btn-medium" onclick="startGame(2)">⭐ TRUNG BÌNH (Vừa)</button>
                <button class="btn btn-hard" onclick="startGame(3)">🔥 KHÓ (Nhanh)</button>
            </div>
        </div>

        <!-- Màn hình chơi chính -->
        <div id="game-play-screen">
            <div class="stats-bar">
                <span id="score-display">Điểm: 0</span>
                <span id="lives-display">❤❤❤</span>[cite: 1]
            </div>

            <div class="road-container" id="road">
                <div class="road-line"></div>
                <div class="road-line right"></div>
                
                <!-- Xe người chơi -->
                <div id="player-car" class="car">🐱</div>
            </div>

            <!-- Nút điều khiển trái / phải -->
            <div class="controls">
                <button class="ctrl-btn" onclick="movePlayer(-1)">◀ TRÁI</button>[cite: 1]
                <button class="ctrl-btn" onclick="movePlayer(1)">PHẢI ▶</button>[cite: 1]
            </div>
        </div>

        <!-- Màn hình Game Over -->
        <div id="gameover-screen">
            <h1 style="color: #ff1a8c;">GAME OVER! 🌸</h1>
            <p id="final-score" style="font-size: 16px; margin: 15px 0; font-weight: 700;">Điểm số của bạn: 0</p>
            <button class="btn btn-easy" style="width: 200px;" onclick="resetGame()">CHƠI LẠI 🎀</button>
        </div>
    </div>

    <script>
        let score = 0;
        let lives = 3;
        let currentLane = 1; // 0: Trái, 1: Giữa, 2: Phải
        const lanePositions = [15, 43, 71]; // % vị trí các làn đường
        let gameInterval = null;
        let obstacleInterval = null;
        let musicInterval = null;
        let isPlaying = false;
        let gameSpeed = 3;
        let obstacles = [];

        // Khởi tạo Web Audio API cho âm thanh và nhạc nền
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type, duration) {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Nhạc nền vui tươi lặp lại tự động
        const melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
        let noteIndex = 0;
        function startBGM() {
            if (musicInterval) clearInterval(musicInterval);
            musicInterval = setInterval(() => {
                if (!isPlaying) return;
                playSound(melody[noteIndex], 'sine', 0.25);
                noteIndex = (noteIndex + 1) % melody.length;
            }, 300);
        }

        function startGame(difficulty) {
            initAudio();
            playSound(523.25, 'sine', 0.2);
            
            if (difficulty === 1) gameSpeed = 2.5;
            if (difficulty === 2) gameSpeed = 4;
            if (difficulty === 3) gameSpeed = 6;

            score = 0;
            lives = 3;
            currentLane = 1;
            obstacles = [];
            
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-play-screen').style.display = 'flex';
            document.getElementById('gameover-screen').style.display = 'none';
            
            updatePlayerPos();
            updateStats();

            isPlaying = true;
            startBGM();
            gameInterval = setInterval(updateGame, 20);
            obstacleInterval = setInterval(spawnObstacle, Math.max(900, 1800 - difficulty * 300));
        }

        function updatePlayerPos() {
            const player = document.getElementById('player-car');
            player.style.left = lanePositions[currentLane] + '%';
        }

        function movePlayer(direction) {
            if (!isPlaying) return;
            playSound(440, 'triangle', 0.1);
            currentLane += direction;
            if (currentLane < 0) currentLane = 0;
            if (currentLane > 2) currentLane = 2;
            updatePlayerPos();
        }

        // Hỗ trợ điều khiển bằng phím mũi tên trên bàn phím máy tính
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft') movePlayer(-1);
            if (e.key === 'ArrowRight') movePlayer(1);
        });

        function spawnObstacle() {
            if (!isPlaying) return;
            const road = document.getElementById('road');
            const lane = Math.floor(Math.random() * 3);
            
            const obs = document.createElement('div');
            obs.className = 'car obstacle';
            obs.innerHTML = '🚗';
            obs.style.left = lanePositions[lane] + '%';
            obs.dataset.lane = lane;
            obs.style.top = '-100px';
            
            road.appendChild(obs);
            obstacles.push({ element: obs, lane: lane, top: -100 });
        }

        function updateGame() {
            if (!isPlaying) return;
            
            score += 1;
            document.getElementById('score-display').innerText = 'Điểm: ' + score;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let ob = obstacles[i];
                ob.top += gameSpeed;
                ob.element.style.top = ob.top + 'px';

                // Kiểm tra va chạm với xe chướng ngại vật đứng yên lao tới
                if (ob.top > 550 && ob.top < 700 && ob.lane === currentLane) {
                    playSound(150, 'sawtooth', 0.3);
                    lives -= 1;
                    updateStats();
                    ob.element.remove();
                    obstacles.splice(i, 1);

                    if (lives <= 0) {
                        gameOver();
                    }
                    continue;
                }

                // Xóa chướng ngại vật khi chạy qua màn hình
                if (ob.top > 750) {
                    ob.element.remove();
                    obstacles.splice(i, 1);
                }
            }
        }

        function updateStats() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤';[cite: 1]
            document.getElementById('lives-display').innerText = hearts;
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            if (musicInterval) clearInterval(musicInterval);
            
            obstacles.forEach(ob => ob.element.remove());
            obstacles = [];

            document.getElementById('final-score').innerText = 'Điểm số của bạn: ' + score;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function resetGame() {
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('game-play-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
